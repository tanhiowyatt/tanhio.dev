<!DOCTYPE html>
<!--
  ╔══════════════════════════════════════════════════════════════════╗
  ║  BLOG POST TEMPLATE                                              ║
  ║                                                                  ║
  ║  HOW TO USE:                                                     ║
  ║  1. Copy this file → blog/YOUR-SLUG.html                         ║
  ║  2. Replace all {{PLACEHOLDERS}} with real values                ║
  ║  3. Add your MDX file → blog/posts/YOUR-SLUG.mdx                 ║
  ║  4. Register in blog.js → posts[] array                          ║
  ║  5. (Optional) Add cover → blog/images/YOUR-SLUG.png             ║
  ║                                                                  ║
  ║  Do NOT change anything in <body> — post-renderer.js             ║
  ║  automatically loads content from the matching .mdx file.        ║
  ╚══════════════════════════════════════════════════════════════════╝
-->
<html lang="EN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111110" />

  <!-- ✏️ CHANGE: Page title shown in browser tab -->
  <title>{{POST_TITLE}} — tanhiowyatt</title>

  <!-- Favicons (do not change) -->
  <link rel="icon" href="../pics/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="../pics/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="../pics/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../pics/favicon-16.png">
  <link rel="apple-touch-icon" href="../pics/apple-touch-icon.png">
  <link rel="manifest" href="../pics/site.webmanifest">

  <!-- Content Security Policy (do not change) -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' https://unpkg.com; font-src 'self' data:; img-src 'self' data: https:; connect-src 'self' https://unpkg.com https://vitals.vercel-insights.com; base-uri 'self'; form-action 'self';">

  <!-- ✏️ CHANGE: Canonical URL → /blog/YOUR-SLUG (no trailing slash) -->
  <link rel="canonical" href="/blog/{{POST_SLUG}}">

  <!-- Styles (do not change) -->
  <link rel="stylesheet" href="../assets/vendor/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../assets/site.css?v=34" />
  <link rel="stylesheet" href="../assets/styles/blog.css?v=2" />

  <!-- Blog RSS Feeds -->
  <link rel="alternate" type="application/rss+xml" title="Blog RSS Feed (RU)" href="/blog/feed.xml" />
  <link rel="alternate" type="application/rss+xml" title="Blog RSS Feed (EN)" href="/blog/feed.en.xml" />
  <link rel="alternate" type="application/rss+xml" title="Blog RSS Feed (PL)" href="/blog/feed.pl.xml" />
  <link rel="stylesheet" href="../assets/styles/output.css" />

  <!-- Scripts (do not change) -->
  <script src="../assets/vendor/js/purify.min.js"
    integrity="sha384-KI2VFGKRhVDym1z+XNqQxgWpLJ8egX+ITfvSY8iWdGZ86B1qIK7/DXPGncRhbK2w"
    crossorigin="anonymous"></script>
  <script defer src="../assets/utils/security.js"></script>
  <script defer src="../assets/utils/sanitize-html.js"></script>
  <script defer src="../assets/utils/click-sound.js"></script>
  <script defer src="../assets/components/ios-scroll-top.js"></script>
  <script defer src="../assets/components/includes.js?v=6"></script>
  <script defer src="../assets/components/mobile-menu.js"></script>
  <script defer src="../assets/components/post-renderer.js?v=7"></script>

  <!-- ✏️ CHANGE: SEO meta tags -->
  <meta name="title" content="{{POST_TITLE}} — tanhiowyatt">
  <meta name="description" content="{{POST_EXCERPT}}">

  <!-- ✏️ CHANGE: Open Graph (Telegram, Facebook, iMessage previews) -->
  <meta property="og:type" content="article">
  <meta property="og:title" content="{{POST_TITLE}} — tanhiowyatt">
  <meta property="og:description" content="{{POST_EXCERPT}}">
  <meta property="og:url" content="https://tanhio.dev/blog/{{POST_SLUG}}">
  <meta property="og:site_name" content="tanhiowyatt">
  <meta property="og:locale" content="en_US">
  <meta property="og:image" content="https://tanhio.dev/pics/preview.png?v=3">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="960">
  <meta property="og:image:height" content="480">
  <meta property="og:image:alt" content="{{POST_TITLE}} — tanhiowyatt">

  <!-- ✏️ CHANGE: X / Twitter card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://tanhio.dev/blog/{{POST_SLUG}}">
  <meta name="twitter:title" content="{{POST_TITLE}} — tanhiowyatt">
  <meta name="twitter:description" content="{{POST_EXCERPT}}">
  <meta name="twitter:image" content="https://tanhio.dev/pics/preview.png?v=3">
</head>

<body>
  <!-- ===================== HEADER ===================== -->
  <div data-include="../partials/header.html"></div>

  <!-- ===================== BLOG POST SECTION ===================== -->
  <!-- Content is loaded automatically by post-renderer.js from the matching .mdx file -->
  <section class="section">
    <div class="mx-auto max-w-5xl px-4">
      <div class="blog-container">
        <div class="flex items-center justify-between gap-4 mb-8">
          <a href="/blog/" id="blog-back-link" class="blog-back-link mb-0">
            <i class="bi bi-arrow-left" aria-hidden="true"></i>
            <span>Back to Blog</span>
          </a>
          <div id="blog-lang-switcher" class="hidden md:block w-36 sm:w-44 flex-shrink-0"></div>
        </div>

        <article class="blog-post">
          <div id="blog-post-header" class="blog-post-header">
            <!-- Post title and date rendered here by post-renderer.js -->
          </div>
          <div id="blog-post-content" class="blog-post-content">
            <!-- Post body rendered here by post-renderer.js -->
          </div>
        </article>

        <!-- RSS Feed Module -->
        <article class="mt-16 blog-rss-module">
          <div class="rss-info">
            <h2 class="blog-post-title flex items-center gap-2" style="margin-bottom: 0.5rem; cursor: default;">
              <i class="bi bi-rss-fill text-orange-500"></i>
              <span>RSS Feeds</span>
            </h2>
            <p class="blog-post-excerpt" style="cursor: default;">Get the latest articles directly in your favorite feed reader.</p>
          </div>
          <div class="rss-btn-group flex-shrink-0">
            <button class="rss-copy-btn" data-feed="/blog/feed.en.xml">
              <i class="bi bi-rss"></i> <span class="rss-btn-text">EN</span>
            </button>
            <button class="rss-copy-btn" data-feed="/blog/feed.pl.xml">
              <i class="bi bi-rss"></i> <span class="rss-btn-text">PL</span>
            </button>
            <button class="rss-copy-btn" data-feed="/blog/feed.xml">
              <i class="bi bi-rss"></i> <span class="rss-btn-text">RU</span>
            </button>
          </div>
        </article>
      </div>
    </div>
  </section>

  <!-- ===================== FOOTER ===================== -->
  <div data-include="../partials/footer.html"></div>
</body>

</html>
