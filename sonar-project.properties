sonar.projectKey=tanhiowyatt_tanhio.dev
sonar.organization=tanhiowyatt

# Exclude generated MkDocs build output and vendored third-party JS.
# sites/cyanide/site/ is rebuilt on every deploy via `mkdocs build` and
# contains generated HTML + bundled JS (tinyseg.js, wordcut.js, lunr, etc.)
# that is not maintained in this repository.
sonar.exclusions=\
  sites/cyanide/site/**,\
  sites/shared/assets/styles/output.css,\
  node_modules/**

# Exclude test files from duplication and coverage noise
sonar.cpd.exclusions=tests/**
sonar.coverage.exclusions=tests/**

# Prevent SonarScanner 6.x from trying to download a JRE via api.sonarcloud.io
# (causes 403 on GitHub Actions runners that already have Java installed)
sonar.scanner.skipJreProvisioning=true
